name: Python Package Tests

on:
  push:
    branches: [ main, feat/asyncio-mqtt ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      # The open SDK is a sibling checkout ([tool.uv.sources] ../simplyprint-sdk).
      - name: Check out simplyprint-sdk next to this repo
        run: git clone --quiet https://github.com/SimplyPrint/simplyprint-sdk.git "$GITHUB_WORKSPACE/../simplyprint-sdk"
      - name: Set up UV ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          ignore-nothing-to-cache: 'true'
      - name: Run tests
        run: |
          uv run pytest