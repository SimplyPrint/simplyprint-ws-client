[project]
name = "simplyprint-ws-client"
version = "2.0.0"
description = "SimplyPrint Websocket Client"
authors = [{ name = "SimplyPrint", email = "contact@simplyprint.io" }]
requires-python = ">=3.9"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "simplyprint",
    "websocket",
    "client",
]
dependencies = [
    # The open printer SDK. The merge-and-diff models (common.model) and the
    # G-code parser (common.utils.gcode_parser) are re-exported from it, so the
    # framework and the brands share one copy of each class.
    "simplyprint-sdk[pydantic]>=0.1.0,<0.2",
    "psutil>=6.0.0,<7",
    "netifaces-plus==0.12.4",
    "sentry-sdk>=2.35.1,<3",
    "platformdirs>=4.4.0,<5",
    "pydantic>=2.11.7",
    "email-validator>=2.0.0",
    "aiohttp>=3.12.15,<4",
    "apscheduler>=3.11,<4",
    "websockets>=13,<16",
    "yarl>=1.18.3,<2",
    "async-timeout ; python_version < '3.11'",
    "strenum ; python_version < '3.11'",
    "typing-extensions",
    "dnspython>=2.6,<3",
]

[project.urls]
Homepage = "https://simplyprint.io"
Repository = "https://github.com/SimplyPrint/printer-ws-client"
"Bug Tracker" = "https://github.com/SimplyPrint/printer-ws-client/issues"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.18",
    "pylint",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]

# paho is not a runtime dependency: it is the reference client the test broker
# is checked against (tests/test_mqtt_broker_conformance.py).
mqtt = [
    "paho-mqtt>=2.1.0",
]
websocket-client = [
    "websocket-client>=1.7.0",
]
uvloop = [
    "uvloop>=0.21.0",
]

# simplyprint-sdk resolves from PyPI, like every other dependency, so CI and
# users install the published release. To develop against a local SDK checkout,
# see "Developing against a local SDK" in README.md; do not commit a path source
# here or a uv.lock that records one.
# [tool.uv.sources]
# simplyprint-sdk = { path = "../simplyprint-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "behavior: product/runtime behavior tests",
    "contract: public API, registry, hook, schema, and cross-surface contracts",
    "guardrail: architecture, import-boundary, brand-boundary, and migration guards",
    "migration: hard-cut migration/tombstone guards",
    "performance: throughput/performance smoke tests",
]

[tool.hatch.build.targets.sdist]
include = ["simplyprint_ws_client"]

[tool.hatch.build.targets.wheel]
include = ["simplyprint_ws_client"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
